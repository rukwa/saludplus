apiVersion: v1
kind: Secret
metadata:
  name: saludplus-db-secret
type: Opaque
stringData:
  # Credenciales para el entorno simulado/local (kind). No usar estos valores en produccion real.
  MYSQL_DATABASE: saludplus_db
  MYSQL_USER: saludplus_user
  MYSQL_PASSWORD: saludplus_pass
  MYSQL_ROOT_PASSWORD: root_pass
