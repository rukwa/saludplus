name: SaludPlus CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  
  # 1. ETAPA DE CALIDAD Y PRUEBAS
 
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Ejecutar Pruebas Unitarias + Gate de Cobertura 
      run: mvn test

    - name: Guardar reporte de cobertura (para el dashboard)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/jacoco.csv
        retention-days: 7

  # 2. ETAPA DE CONSTRUCCIÓN, SEGURIDAD Y DESPLIEGUE SIMULADO
  build-and-deploy:
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir Imagen Docker
      run: |
        docker build -t saludplus-service:${{ github.sha }} .
        docker tag saludplus-service:${{ github.sha }} saludplus-service:latest

    - name: Auditoría de Seguridad de la Imagen con Trivy (IE5/IE6)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'saludplus-service:${{ github.sha }}'
        severity: 'CRITICAL'
        ignore-unfixed: true
        exit-code: '1'
        format: 'table'

    - name: Desplegar microservicio + stack de observabilidad (IE1/IE2)
      run: |
        echo "Iniciando despliegue automatizado..."
        docker compose up -d
        echo "Esperando a que el microservicio quede saludable..."
        for i in $(seq 1 15); do
          if curl -sf http://localhost:8080/actuator/health > /dev/null; then
            echo "Servicio saludable."
            break
          fi
          echo "Aun no responde, reintentando ($i/15)..."
          sleep 5
        done
        echo "Verificando estado de los contenedores:"
        docker compose ps
        echo "Trazabilidad exitosa para el commit: ${{ github.sha }}"

    - name: Descargar reporte de cobertura
      uses: actions/download-artifact@v4
      with:
        name: jacoco-report
        path: jacoco-report


    - name: Publicar métricas de CI en el Dashboard (IE3)
      run: |
        COVERAGE=$(awk -F"," 'NR>1 {covered+=$9; missed+=$8} END {if (covered+missed==0) print 0; else printf "%.4f", covered/(covered+missed)}' jacoco-report/jacoco.csv)
        DEPLOY_DURATION=$SECONDS
        echo "Cobertura de lineas: ${COVERAGE}"
        echo "Duracion del job hasta ahora: ${DEPLOY_DURATION}s"
        printf "saludplus_test_coverage_ratio %s\nsaludplus_deploy_duration_seconds %s\n" "$COVERAGE" "$DEPLOY_DURATION" | curl -s --data-binary @- http://localhost:9091/metrics/job/ci_pipeline
        echo "Metricas publicadas en Pushgateway -> visibles en Grafana (http://localhost:3000)"

  # 3. ETAPA DE ORQUESTACIÓN: KUBERNETES (IE2)

  k8s-deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Construir Imagen Docker
      run: docker build -t saludplus-service:latest .

    - name: Crear cluster Kubernetes local (kind)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: saludplus-cluster

    - name: Cargar la imagen dentro del cluster
      run: kind load docker-image saludplus-service:latest --name saludplus-cluster

    - name: Desplegar manifiestos en Kubernetes (IE2)
      run: |
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/mysql-deployment.yaml
        kubectl apply -f k8s/saludplus-deployment.yaml
        echo "Esperando a que el Deployment quede disponible..."
        kubectl rollout status deployment/saludplus-deployment --timeout=180s

    - name: Verificar despliegue
      if: always()
      run: |
        kubectl get pods,svc,deployments -o wide
        kubectl describe pod -l app=saludplus | tail -n 40

